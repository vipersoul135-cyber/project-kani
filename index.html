<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <title>✨ Magical Beauty Scanner ✨</title>

    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            color: white;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at 50% 0%, #512a7d 0%, #24103e 35%, #0b0615 75%);

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* =========================================
   BACKGROUND
========================================= */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 0 8px white;
            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {
            0% {
                opacity: .1;
                transform: scale(.5);
            }

            100% {
                opacity: 1;
                transform: scale(1.6);
            }
        }

        .moon {
            position: absolute;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            right: -80px;
            top: -80px;

            background:
                radial-gradient(circle at 35% 35%,
                    #fff,
                    #e8d9ff 40%,
                    rgba(190, 130, 255, .2) 65%,
                    transparent 70%);

            filter: blur(1px);
            opacity: .45;
        }

        /* floating particles */

        .particle {
            position: absolute;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #d89cff;
            box-shadow: 0 0 15px #d89cff;

            animation: floatParticle 8s linear infinite;
        }

        @keyframes floatParticle {

            0% {
                transform: translateY(110vh) translateX(0);
                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            85% {
                opacity: 1;
            }

            100% {
                transform: translateY(-20vh) translateX(100px);
                opacity: 0;
            }
        }


        /* =========================================
   MAIN
========================================= */

        .app {
            position: relative;
            z-index: 5;

            width: min(1050px, 95vw);

            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;
        }

        .logo {
            font-size: 14px;
            letter-spacing: 5px;
            color: #cda8ed;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .title {
            font-family: Georgia, serif;
            font-size: clamp(34px, 5vw, 55px);

            background:
                linear-gradient(90deg,
                    #fff,
                    #e5baff,
                    #fff);

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            text-shadow:
                0 0 25px rgba(214, 146, 255, .45);

            margin-bottom: 8px;
        }

        .subtitle {
            color: #cbb8dd;
            font-size: 15px;
            margin-bottom: 25px;
        }


        /* =========================================
   SCANNER
========================================= */

        .scanner-wrapper {
            position: relative;
            width: min(720px, 94vw);
        }

        .camera-container {

            position: relative;

            width: 100%;
            height: min(500px, 60vh);

            min-height: 350px;

            border-radius: 35px;

            overflow: hidden;

            background: #030207;

            border: 1px solid rgba(255, 255, 255, .18);

            box-shadow:
                0 0 40px rgba(181, 93, 255, .35),
                0 0 100px rgba(117, 59, 180, .18),
                inset 0 0 50px rgba(255, 255, 255, .04);
        }

        video {
            width: 100%;
            height: 100%;

            object-fit: cover;

            transform: scaleX(-1);

            display: block;
        }

        .camera-dark {
            position: absolute;
            inset: 0;

            background:
                radial-gradient(ellipse at center,
                    transparent 20%,
                    rgba(0, 0, 0, .15) 50%,
                    rgba(0, 0, 0, .65) 100%);

            pointer-events: none;
        }


        /* =========================================
   HUD
========================================= */

        .hud {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        /* top data */

        .top-data {
            position: absolute;
            top: 18px;
            left: 22px;
            right: 22px;

            display: flex;
            justify-content: space-between;

            font-family: monospace;
            font-size: 11px;

            color: #d7b2ff;
            opacity: .8;
        }

        .system {
            display: flex;
            gap: 7px;
            align-items: center;
        }

        .system-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #a95cff;
            box-shadow: 0 0 10px #a95cff;
        }

        .system-dot.active {
            background: #55ffae;
            box-shadow: 0 0 12px #55ffae;
        }


        /* scanning oval */

        .face-guide {

            position: absolute;

            width: 285px;
            height: 365px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border: 2px solid rgba(213, 153, 255, .8);

            border-radius:
                50% 50% 47% 47%;

            box-shadow:
                0 0 20px rgba(202, 112, 255, .55),
                inset 0 0 25px rgba(183, 91, 255, .15);

            transition: .4s;
        }

        .face-guide.detected {

            border-color: #65ffbd;

            box-shadow:
                0 0 25px rgba(74, 255, 176, .8),
                inset 0 0 30px rgba(74, 255, 176, .15);
        }


        /* corners */

        .corner {
            position: absolute;
            width: 38px;
            height: 38px;
        }

        .corner.tl {
            left: -3px;
            top: -3px;
            border-left: 4px solid #fff;
            border-top: 4px solid #fff;
        }

        .corner.tr {
            right: -3px;
            top: -3px;
            border-right: 4px solid #fff;
            border-top: 4px solid #fff;
        }

        .corner.bl {
            left: -3px;
            bottom: -3px;
            border-left: 4px solid #fff;
            border-bottom: 4px solid #fff;
        }

        .corner.br {
            right: -3px;
            bottom: -3px;
            border-right: 4px solid #fff;
            border-bottom: 4px solid #fff;
        }


        /* laser */

        .laser {

            position: absolute;

            left: -20px;
            right: -20px;

            height: 3px;

            background:
                linear-gradient(90deg,
                    transparent,
                    #d990ff,
                    #fff,
                    #d990ff,
                    transparent);

            box-shadow:
                0 0 10px #cf7aff,
                0 0 25px #a94eff;

            animation: laserMove 2.2s linear infinite;
        }

        @keyframes laserMove {

            0% {
                top: 3%;
                opacity: .2;
            }

            20% {
                opacity: 1;
            }

            50% {
                top: 97%;
            }

            80% {
                opacity: 1;
            }

            100% {
                top: 3%;
                opacity: .2;
            }
        }


        /* scan lines */

        .scan-lines {

            position: absolute;
            inset: 0;

            background:
                repeating-linear-gradient(0deg,
                    transparent 0px,
                    transparent 5px,
                    rgba(220, 160, 255, .025) 6px);

            opacity: .7;
        }


        /* =========================================
   DETECTION INFO
========================================= */

        .face-info {

            position: absolute;

            left: 18px;
            bottom: 18px;

            text-align: left;

            font-family: monospace;
            font-size: 11px;

            color: #cfa9ed;

            line-height: 1.7;
        }

        .face-info span {
            color: #fff;
        }


        /* progress */

        .progress-area {

            position: absolute;

            right: 18px;
            bottom: 18px;

            width: 160px;

            text-align: right;
        }

        .progress-label {

            font-family: monospace;
            font-size: 11px;

            color: #cfa9ed;

            margin-bottom: 5px;
        }

        .progress-bar {

            width: 100%;
            height: 5px;

            background: rgba(255, 255, 255, .1);

            border-radius: 10px;

            overflow: hidden;
        }

        .progress-fill {

            width: 0%;
            height: 100%;

            background:
                linear-gradient(90deg,
                    #8c48ff,
                    #e39aff);

            box-shadow: 0 0 12px #d878ff;

            transition: .25s;
        }


        /* =========================================
   STATUS
========================================= */

        .status {

            min-height: 30px;

            margin-top: 18px;

            color: #eadcff;

            font-size: 16px;
        }

        .status strong {
            color: #fff;
        }

        .loading-dots span {

            display: inline-block;

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #d08aff;

            margin-left: 3px;

            animation: dot 1s infinite;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: .2s;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: .4s;
        }

        @keyframes dot {

            0%,
            100% {
                opacity: .2;
                transform: translateY(0);
            }

            50% {
                opacity: 1;
                transform: translateY(-4px);
            }
        }


        /* =========================================
   BUTTON
========================================= */

        .start-button {

            margin-top: 14px;

            padding: 15px 35px;

            border: none;

            border-radius: 50px;

            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            background:
                linear-gradient(135deg,
                    #c75fff,
                    #7350ff);

            box-shadow:
                0 0 20px rgba(183, 91, 255, .45);

            transition: .3s;
        }

        .start-button:hover {

            transform:
                translateY(-3px) scale(1.03);

            box-shadow:
                0 0 35px rgba(202, 116, 255, .8);
        }

        .start-button:disabled {

            opacity: .5;
            cursor: not-allowed;
        }


        /* =========================================
   RESULT OVERLAY
========================================= */

        .result {

            position: fixed;
            inset: 0;

            z-index: 100;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                radial-gradient(circle,
                    rgba(90, 37, 126, .5),
                    rgba(5, 2, 12, .96));

            backdrop-filter: blur(16px);
        }

        .result.show {
            display: flex;
            animation: resultFade .8s ease;
        }

        @keyframes resultFade {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }


        /* =========================================
   MAGIC CARD
========================================= */

        .magic-card {

            position: relative;

            width: min(480px, 95vw);

            padding: 25px;

            border-radius: 35px;

            text-align: center;

            background:
                linear-gradient(145deg,
                    rgba(67, 35, 95, .98),
                    rgba(18, 9, 31, .98));

            border: 1px solid rgba(232, 192, 255, .4);

            box-shadow:
                0 0 60px rgba(184, 100, 255, .5),
                0 25px 100px rgba(0, 0, 0, .6);

            animation:
                cardEnter 1s cubic-bezier(.2, .9, .2, 1);
        }

        @keyframes cardEnter {

            0% {
                transform:
                    translateY(80px) scale(.65) rotate(-6deg);

                opacity: 0;
            }

            70% {
                transform:
                    translateY(-8px) scale(1.03) rotate(1deg);

                opacity: 1;
            }

            100% {
                transform:
                    translateY(0) scale(1) rotate(0);
            }
        }


        /* crown */

        .crown {

            position: absolute;

            top: -40px;
            left: 50%;

            transform: translateX(-50%);

            font-size: 55px;

            filter:
                drop-shadow(0 0 15px #ffdc70);

            animation: crownFloat 2s infinite alternate;
        }

        @keyframes crownFloat {

            from {
                transform:
                    translateX(-50%) translateY(0) rotate(-3deg);
            }

            to {
                transform:
                    translateX(-50%) translateY(-7px) rotate(3deg);
            }
        }


        /* image */

        .princess-image {

            width: 245px;
            height: 290px;

            object-fit: cover;

            border-radius: 28px;

            border: 3px solid rgba(240, 202, 255, .8);

            box-shadow:
                0 0 25px rgba(211, 127, 255, .65),
                0 0 70px rgba(182, 89, 255, .25);

            margin-bottom: 20px;

            animation: imageGlow 3s infinite alternate;
        }

        @keyframes imageGlow {

            from {
                box-shadow:
                    0 0 20px rgba(211, 127, 255, .5);
            }

            to {
                box-shadow:
                    0 0 40px rgba(235, 169, 255, .9);
            }
        }


        /* heading */

        .magic-card h2 {

            font-family: Georgia, serif;

            font-size: 31px;

            color: #f4dcff;

            margin-bottom: 15px;
        }


        /* typewriter */

        .message {

            min-height: 100px;

            color: #e4d4ee;

            font-size: 16px;

            line-height: 1.75;
        }


        /* buttons */

        .result-buttons {

            display: flex;

            justify-content: center;

            gap: 10px;

            flex-wrap: wrap;

            margin-top: 20px;
        }

        .result-button {

            border: none;

            border-radius: 30px;

            padding: 12px 22px;

            cursor: pointer;

            font-weight: bold;

            transition: .25s;
        }

        .result-button:hover {
            transform: translateY(-2px);
        }

        .continue {

            background: white;
            color: #35164d;
        }

        .again {

            background:
                rgba(255, 255, 255, .08);

            border: 1px solid rgba(255, 255, 255, .2);

            color: white;
        }


        /* =========================================
   HEARTS
========================================= */

        .heart {

            position: fixed;

            z-index: 200;

            pointer-events: none;

            font-size: 25px;

            animation: heartFly 2.5s ease-out forwards;
        }

        @keyframes heartFly {

            0% {
                transform:
                    translate(0, 0) scale(.5) rotate(0);

                opacity: 1;
            }

            100% {
                transform:
                    translate(calc(-150px + 300px * var(--x)),
                        -500px) scale(1.5) rotate(360deg);

                opacity: 0;
            }
        }


        /* =========================================
   CAPTURE
========================================= */

        .capture-message {

            position: fixed;

            top: 25px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 300;

            padding: 12px 22px;

            background: rgba(25, 12, 40, .95);

            border: 1px solid rgba(225, 178, 255, .3);

            border-radius: 30px;

            color: #ead8f6;

            display: none;
        }


        /* =========================================
   MOBILE
========================================= */

        @media(max-width:600px) {

            .camera-container {
                height: 58vh;
                min-height: 360px;
            }

            .face-guide {
                width: 220px;
                height: 290px;
            }

            .top-data {
                font-size: 9px;
            }

            .face-info {
                font-size: 9px;
            }

            .progress-area {
                width: 120px;
            }

            .princess-image {
                width: 190px;
                height: 230px;
            }

            .magic-card {
                padding: 20px;
            }

            .magic-card h2 {
                font-size: 26px;
            }
        }
    </style>
</head>


<body>


    <!-- =========================================
     BACKGROUND
========================================= -->

    <div class="background">

        <div class="moon"></div>

        <div class="star" style="left:5%;top:12%"></div>
        <div class="star" style="left:12%;top:75%"></div>
        <div class="star" style="left:21%;top:28%"></div>
        <div class="star" style="left:29%;top:87%"></div>
        <div class="star" style="left:37%;top:14%"></div>
        <div class="star" style="left:46%;top:70%"></div>
        <div class="star" style="left:55%;top:20%"></div>
        <div class="star" style="left:64%;top:82%"></div>
        <div class="star" style="left:72%;top:35%"></div>
        <div class="star" style="left:81%;top:12%"></div>
        <div class="star" style="left:90%;top:70%"></div>
        <div class="star" style="left:96%;top:25%"></div>

        <div class="particle" style="left:8%;animation-delay:0s"></div>
        <div class="particle" style="left:24%;animation-delay:2s"></div>
        <div class="particle" style="left:45%;animation-delay:4s"></div>
        <div class="particle" style="left:67%;animation-delay:1s"></div>
        <div class="particle" style="left:85%;animation-delay:5s"></div>

    </div>


    <!-- =========================================
     MAIN
========================================= -->

    <main class="app">

        <div class="logo">
            ✦ Royal Beauty System ✦
        </div>

        <h1 class="title">
            Magical Face Scanner
        </h1>

        <p class="subtitle">
            Let's discover the magic hidden behind that beautiful face...
        </p>


        <div class="scanner-wrapper">

            <div class="camera-container">

                <video id="camera" autoplay playsinline muted></video>

                <div class="camera-dark"></div>

                <div class="scan-lines"></div>


                <div class="hud">

                    <div class="top-data">

                        <div class="system">
                            <span class="system-dot" id="systemDot"></span>
                            <span id="systemText">
                                SYSTEM STANDBY
                            </span>
                        </div>

                        <div>
                            SECURE SCAN // 001
                        </div>

                    </div>


                    <div class="face-guide" id="faceGuide">

                        <div class="corner tl"></div>
                        <div class="corner tr"></div>
                        <div class="corner bl"></div>
                        <div class="corner br"></div>

                        <div class="laser"></div>

                    </div>


                    <div class="face-info">

                        FACE STATUS:
                        <span id="faceStatus">WAITING</span>
                        <br>

                        POSITION:
                        <span id="position">--</span>
                        <br>

                        MAGIC LEVEL:
                        <span id="magicLevel">0%</span>

                    </div>


                    <div class="progress-area">

                        <div class="progress-label">
                            SCAN PROGRESS
                            <span id="progressNumber">0%</span>
                        </div>

                        <div class="progress-bar">

                            <div class="progress-fill" id="progressFill">
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>


        <div class="status" id="status">
            Camera is waiting...
        </div>


        <button class="start-button" id="startButton">

            ✨ Begin Magical Scan

        </button>

    </main>


    <!-- =========================================
     RESULT
========================================= -->

    <section class="result" id="result">

        <div class="magic-card">

            <div class="crown">
                👑
            </div>


            <img src="img/bfdc724276a5c59d8303af967d981614.jpg" class="princess-image" alt="Beautiful Cinderella">


            <h2>
                ✨ Cinderella Found ✨
            </h2>


            <div class="message" id="message">
            </div>


            <div class="result-buttons">

                <button class="result-button continue" onclick="closeResult()">

                    💖 Continue

                </button>


                <button class="result-button again" onclick="scanAgain()">

                    🔄 Scan Again

                </button>

            </div>

        </div>

    </section>


    <div class="capture-message" id="captureMessage">

        📸 Magical moment captured!

    </div>


    <script>

        /* =========================================
           ELEMENTS
        ========================================= */

        const video =
            document.getElementById("camera");

        const startButton =
            document.getElementById("startButton");

        const statusText =
            document.getElementById("status");

        const result =
            document.getElementById("result");

        const faceGuide =
            document.getElementById("faceGuide");

        const faceStatus =
            document.getElementById("faceStatus");

        const positionText =
            document.getElementById("position");

        const magicLevel =
            document.getElementById("magicLevel");

        const progressFill =
            document.getElementById("progressFill");

        const progressNumber =
            document.getElementById("progressNumber");

        const systemDot =
            document.getElementById("systemDot");

        const systemText =
            document.getElementById("systemText");

        const message =
            document.getElementById("message");


        let stream = null;
        let faceDetector = null;
        let cameraController = null;

        let faceDetected = false;
        let scanning = false;
        let scanProgress = 0;


        /* =========================================
           SOUND SYSTEM
        ========================================= */

        let audioContext = null;

        function initAudio() {

            if (!audioContext) {

                audioContext =
                    new (
                        window.AudioContext ||
                        window.webkitAudioContext
                    )();

            }

        }


        function playTone(
            frequency = 600,
            duration = .15,
            type = "sine"
        ) {

            try {

                initAudio();

                const oscillator =
                    audioContext.createOscillator();

                const gain =
                    audioContext.createGain();

                oscillator.type = type;

                oscillator.frequency.value =
                    frequency;

                gain.gain.setValueAtTime(
                    .0001,
                    audioContext.currentTime
                );

                gain.gain.exponentialRampToValueAtTime(
                    .08,
                    audioContext.currentTime + .02
                );

                gain.gain.exponentialRampToValueAtTime(
                    .0001,
                    audioContext.currentTime + duration
                );

                oscillator.connect(gain);
                gain.connect(audioContext.destination);

                oscillator.start();

                oscillator.stop(
                    audioContext.currentTime + duration
                );

            } catch (e) { }

        }


        /* =========================================
           FACE DETECTOR
        ========================================= */

        function setupFaceDetector() {

            faceDetector =
                new FaceDetection({

                    locateFile: (file) => {

                        return `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`;

                    }

                });


            faceDetector.setOptions({

                model: "short",

                minDetectionConfidence: .65

            });


            faceDetector.onResults(
                handleFaceResults
            );

        }


        /* =========================================
           FACE RESULT
        ========================================= */

        function handleFaceResults(results) {

            if (!scanning)
                return;


            if (
                results.detections &&
                results.detections.length > 0
            ) {

                faceDetected = true;

                const detection =
                    results.detections[0];

                const box =
                    detection.boundingBox;


                faceGuide.classList.add("detected");

                faceStatus.textContent =
                    "DETECTED";

                positionText.textContent =
                    "LOCKED";

                systemDot.classList.add("active");

                systemText.textContent =
                    "FACE LOCKED";


                const confidence =
                    Math.round(
                        (detection.score?.[0] || .9) * 100
                    );


                magicLevel.textContent =
                    Math.min(
                        100,
                        Math.round(
                            confidence +
                            scanProgress * .15
                        )
                    ) + "%";


                if (scanProgress < 100) {

                    scanProgress += 1.2;

                    updateProgress();

                }

            } else {

                faceDetected = false;

                faceGuide.classList.remove("detected");

                faceStatus.textContent =
                    "SEARCHING";

                positionText.textContent =
                    "MOVE TO CENTER";

                systemText.textContent =
                    "SEARCHING...";

                systemDot.classList.remove("active");

            }

        }


        /* =========================================
           CAMERA
        ========================================= */

        async function startCamera() {

            try {

                initAudio();

                playTone(500, .12);

                startButton.disabled = true;

                statusText.innerHTML =
                    "Requesting camera access...";

                stream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {
                            facingMode: "user",
                            width: {
                                ideal: 1280
                            },
                            height: {
                                ideal: 720
                            }
                        },

                        audio: false

                    });


                video.srcObject = stream;


                await video.play();


                setupFaceDetector();


                cameraController =
                    new Camera(video, {

                        onFrame: async () => {

                            if (faceDetector) {

                                await faceDetector.send({
                                    image: video
                                });

                            }

                        },

                        width: 1280,
                        height: 720

                    });


                cameraController.start();


                statusText.innerHTML =
                    "🔍 <strong>Searching for your face...</strong>";


                systemText.textContent =
                    "SCANNER ONLINE";


                startButton.style.display =
                    "none";


                beginScanning();

            } catch (error) {

                console.error(error);

                statusText.innerHTML =
                    "⚠️ Camera permission was not granted.";

                startButton.disabled =
                    false;

            }

        }


        /* =========================================
           SCANNING SEQUENCE
        ========================================= */

        function beginScanning() {

            scanning = true;

            scanProgress = 0;

            updateProgress();


            let stage = 0;


            const scanner =
                setInterval(() => {

                    if (!scanning) {

                        clearInterval(scanner);

                        return;

                    }


                    if (!faceDetected) {

                        statusText.innerHTML =
                            "🔍 Please place your face inside the glowing frame...";

                        return;

                    }


                    stage++;


                    if (stage === 1) {

                        statusText.innerHTML =
                            "🟢 Face detected...";

                        playTone(700, .1);

                    }


                    if (stage === 2) {

                        statusText.innerHTML =
                            "🔬 Mapping facial features...";

                        playTone(800, .1);

                    }


                    if (stage === 3) {

                        statusText.innerHTML =
                            "✨ Measuring magical beauty level...";

                        playTone(900, .12);

                    }


                    if (stage === 4) {

                        statusText.innerHTML =
                            "💎 Checking sparkle signature...";

                        playTone(1000, .12);

                    }


                    if (stage === 5) {

                        statusText.innerHTML =
                            "👑 Royal identity almost confirmed...";

                        playTone(1100, .15);

                    }


                    if (stage >= 7) {

                        clearInterval(scanner);

                        finishScan();

                    }

                }, 800);

        }


        /* =========================================
           PROGRESS
        ========================================= */

        function updateProgress() {

            const value =
                Math.min(
                    100,
                    Math.round(scanProgress)
                );


            progressFill.style.width =
                value + "%";

            progressNumber.textContent =
                value + "%";

        }


        /* =========================================
           FINISH
        ========================================= */

        function finishScan() {

            scanning = false;

            scanProgress = 100;

            updateProgress();


            faceGuide.classList.add("detected");


            statusText.innerHTML =
                "✨ <strong>MAGICAL SCAN COMPLETE</strong>";


            systemText.textContent =
                "ROYAL MATCH FOUND";


            playTone(900, .15);

            setTimeout(() => {
                playTone(1200, .2);
            }, 150);

            setTimeout(() => {
                playTone(1500, .3);
            }, 350);


            createHearts();


            setTimeout(() => {

                stopCamera();

                showResult();

            }, 1000);

        }


        /* =========================================
           RESULT
        ========================================= */

        function showResult() {

            result.classList.add("show");

            typeMessage();

        }


        /* =========================================
           TYPEWRITER
        ========================================= */

        function typeMessage() {

            const text =
                `The scanner has completed its magical analysis...

And the result is absolutely clear.

It didn't discover just another beautiful face.

It discovered someone with a little bit of Cinderella magic. 💙

Some people need a fairy godmother to become magical...

You?

You already had the magic. ✨`;

            message.innerHTML = "";

            let index = 0;


            function type() {

                if (index < text.length) {

                    if (text[index] === "\n") {

                        message.innerHTML += "<br>";

                    } else {

                        message.innerHTML +=
                            text[index];

                    }

                    index++;

                    setTimeout(type, 25);

                }

            }

            type();

        }


        /* =========================================
           HEART PARTICLES
        ========================================= */

        function createHearts() {

            const emojis =
                ["💖", "💗", "💜", "✨", "💙", "💕", "🌸"];


            for (let i = 0; i < 35; i++) {

                setTimeout(() => {

                    const heart =
                        document.createElement("div");

                    heart.className =
                        "heart";

                    heart.textContent =
                        emojis[
                        Math.floor(
                            Math.random() * emojis.length
                        )
                        ];


                    heart.style.left =
                        (20 + Math.random() * 60) + "vw";

                    heart.style.top =
                        (55 + Math.random() * 25) + "vh";

                    heart.style.setProperty(
                        "--x",
                        Math.random()
                    );


                    document.body.appendChild(
                        heart
                    );


                    setTimeout(() => {

                        heart.remove();

                    }, 2600);

                }, i * 60);

            }

        }


        /* =========================================
           STOP CAMERA
        ========================================= */

        function stopCamera() {

            scanning = false;


            if (stream) {

                stream
                    .getTracks()
                    .forEach(track => {
                        track.stop();
                    });

                stream = null;

            }


            if (cameraController) {

                try {

                    cameraController.stop();

                } catch (e) { }

                cameraController = null;

            }

        }


        /* =========================================
           CLOSE RESULT
        ========================================= */

        function closeResult() {

            result.classList.remove("show");

            startButton.style.display =
                "inline-block";

            startButton.disabled =
                false;

            statusText.innerHTML =
                "Ready for another magical adventure ✨";

            systemText.textContent =
                "SYSTEM STANDBY";

            systemDot.classList.remove("active");

            faceGuide.classList.remove("detected");

            progressFill.style.width =
                "0%";

            progressNumber.textContent =
                "0%";

            faceStatus.textContent =
                "WAITING";

            positionText.textContent =
                "--";

            magicLevel.textContent =
                "0%";

        }


        /* =========================================
           SCAN AGAIN
        ========================================= */

        function scanAgain() {

            result.classList.remove("show");

            startButton.style.display =
                "inline-block";

            startButton.disabled =
                false;

            statusText.innerHTML =
                "Ready for another magical scan ✨";

        }


        /* =========================================
           BUTTON
        ========================================= */

        startButton.addEventListener(
            "click",
            startCamera
        );


        /* =========================================
           ESC
        ========================================= */

        document.addEventListener(
            "keydown",
            e => {

                if (e.key === "Escape") {

                    closeResult();

                }

            }
        );


        /* =========================================
           INITIAL MESSAGE
        ========================================= */

        window.addEventListener(
            "load",
            () => {

                statusText.innerHTML =
                    "Camera is waiting... Click the button to begin ✨";

            }
        );

    </script>

</body>
